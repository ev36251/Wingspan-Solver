[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wingspan-solver"
version = "0.1.0"
description = "Wingspan board game solver with heuristic and Monte Carlo evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
# Screenshot import (backend/vision): reads game states from screenshots via
# the Claude API. Needs ANTHROPIC_API_KEY at runtime.
vision = [
    "anthropic>=0.100.0",
]

# The repo has several top-level dirs (backend, models, frontend, ...); only
# `backend` is an importable Python package. Scope discovery to it so the
# editable install (pip install -e .) doesn't error on "multiple top-level
# packages". Tests import via pythonpath=["."], not the installed dist.
[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated.*:DeprecationWarning:openpyxl\\.packaging\\.core",
]
